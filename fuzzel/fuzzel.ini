# fuzzel — App-Launcher für sway (Mod+D)
# Farben: CharmTone  |  Referenz: man 5 fuzzel.ini

font=JuliaMono:size=12
prompt=❯ 
icons-enabled=yes
terminal=wezterm -e
layer=overlay

# Breite in Zeichen, Höhe in Zeilen
width=45
lines=12

horizontal-pad=24
vertical-pad=18
inner-pad=10

# Farben ohne '#', immer mit Alpha-Kanal (RRGGBBAA)
[colors]
background=201F26f0
text=BFBCC8ff
prompt=8B75FFff
placeholder=858392ff
input=F7F6FBff
match=00FFB2ff
selection=6B50FFff
selection-text=F7F6FBff
selection-match=00FFB2ff
border=6B50FFff

[border]
width=2
radius=12
